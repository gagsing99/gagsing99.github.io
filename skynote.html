<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Life = you</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background-color: #030306;
    color: #f8fafc;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    gap: 18px;
  }
  .card-wrap {
    width: min(92vw, 72dvh, 460px);
    height: min(92vw, 72dvh, 460px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 22px 55px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(255, 255, 255, 0.14);
    background: #05060b;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  button {
    background: rgba(255, 255, 255, 0.10);
    color: #f8fafc;
    border: 1px solid rgba(255, 255, 255, 0.22);
    padding: 14px 32px;
    min-height: 48px;
    border-radius: 999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.12s;
    touch-action: manipulation;
  }
  button:active {
    background: rgba(255, 255, 255, 0.22);
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <div class="card-wrap">
    <canvas id="noteCanvas" width="900" height="900"></canvas>
  </div>
  <button id="saveBtn" type="button">Save Image</button>

<script>
(function () {
  var canvas = document.getElementById("noteCanvas");
  var ctx = canvas.getContext("2d");
  var W = 900;
  var H = 900;

  // 1. Glittery stars
  var stars = [];
  for (var i = 0; i < 115; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.9 + Math.random() * 2.4,
      sparkle: Math.random() < 0.36,
      phase: Math.random() * Math.PI * 2,
      speed: 0.02 + Math.random() * 0.04
    });
  }

  // 2. Drifting soft clouds
  var clouds = [
    { x: 160, y: 170, scale: 1.25, speed: 0.16, alpha: 0.20 },
    { x: 710, y: 290, scale: 1.05, speed: -0.12, alpha: 0.16 },
    { x: 260, y: 710, scale: 1.40, speed: 0.14, alpha: 0.22 },
    { x: 750, y: 770, scale: 1.10, speed: -0.10, alpha: 0.15 }
  ];

  // 3. Touch & pointer stardust bursts
  var bursts = [];
  function spawnStardust(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var x = ((clientX - rect.left) / rect.width) * W;
    var y = ((clientY - rect.top) / rect.height) * H;
    for (var i = 0; i < 14; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 0.7 + Math.random() * 2.6;
      bursts.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1.0,
        size: 1.8 + Math.random() * 2.6
      });
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    spawnStardust(e.clientX, e.clientY);
  }, { passive: false });

  canvas.addEventListener("pointermove", function (e) {
    if (e.buttons > 0 || e.pointerType === "touch") {
      spawnStardust(e.clientX, e.clientY);
    }
  });

  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);

    var puffs = [
      { x: 0, y: 0, r: 72 },
      { x: -58, y: 14, r: 56 },
      { x: 62, y: 12, r: 58 },
      { x: -106, y: 24, r: 42 },
      { x: 112, y: 22, r: 44 }
    ];

    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i];
      var grad = ctx.createRadialGradient(p.x, p.y - 8, p.r * 0.1, p.x, p.y, p.r);
      grad.addColorStop(0, "rgba(215, 225, 245, " + c.alpha + ")");
      grad.addColorStop(0.55, "rgba(130, 145, 175, " + (c.alpha * 0.55) + ")");
      grad.addColorStop(1, "rgba(20, 24, 38, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHeartMoon(cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);

    // Outer moonlight aura
    var halo = ctx.createRadialGradient(0, 0, size * 0.2, 0, 0, size * 2.3);
    halo.addColorStop(0, "rgba(255, 250, 225, 0.34)");
    halo.addColorStop(0.5, "rgba(220, 230, 255, 0.10)");
    halo.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, size * 2.3, 0, Math.PI * 2);
    ctx.fill();

    // Heart path centered around (0,0)
    ctx.save();
    ctx.translate(0, -size * 0.85);

    ctx.beginPath();
    ctx.moveTo(0, size * 0.35);
    ctx.bezierCurveTo(0, 0, -size, 0, -size, size * 0.55);
    ctx.bezierCurveTo(-size, size * 1.05, 0, size * 1.38, 0, size * 1.65);
    ctx.bezierCurveTo(0, size * 1.38, size, size * 1.05, size, size * 0.55);
    ctx.bezierCurveTo(size, 0, 0, 0, 0, size * 0.35);
    ctx.closePath();

    ctx.shadowColor = "rgba(255, 248, 214, 0.85)";
    ctx.shadowBlur = 32;

    var moonGrad = ctx.createLinearGradient(-size, 0, size, size * 1.6);
    moonGrad.addColorStop(0, "#fffdf5");
    moonGrad.addColorStop(0.55, "#f7eecf");
    moonGrad.addColorStop(1, "#dfd0a2");
    ctx.fillStyle = moonGrad;
    ctx.fill();

    // Subtle lunar craters clipped inside heart
    ctx.clip();
    ctx.shadowBlur = 0;
    var craters = [
      { x: -size * 0.38, y: size * 0.52, r: size * 0.14 },
      { x: size * 0.32, y: size * 0.72, r: size * 0.18 },
      { x: -size * 0.10, y: size * 1.05, r: size * 0.11 },
      { x: size * 0.42, y: size * 0.38, r: size * 0.09 }
    ];
    for (var i = 0; i < craters.length; i++) {
      var cr = craters[i];
      ctx.fillStyle = "rgba(175, 160, 120, 0.22)";
      ctx.beginPath();
      ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    ctx.restore();
  }

  function drawFourPointStar(x, y, radius, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(255, 255, 255, " + alpha + ")";
    ctx.shadowColor = "rgba(255, 255, 255, " + alpha + ")";
    ctx.shadowBlur = 9;

    ctx.beginPath();
    var spikes = 4;
    var outer = radius * 2.4;
    var inner = radius * 0.35;
    for (var i = 0; i < spikes * 2; i++) {
      var r = i % 2 === 0 ? outer : inner;
      var angle = (i * Math.PI) / spikes;
      var px = Math.cos(angle) * r;
      var py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function render() {
    // Deep black night sky gradient
    var bg = ctx.createRadialGradient(W * 0.5, H * 0.35, 45, W * 0.5, H * 0.5, W * 0.75);
    bg.addColorStop(0, "#0d111f");
    bg.addColorStop(0.55, "#05060b");
    bg.addColorStop(1, "#010103");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.phase += s.speed;
      var alpha = 0.45 + 0.55 * Math.abs(Math.sin(s.phase));
      if (s.sparkle) {
        drawFourPointStar(s.x, s.y, s.r, alpha);
      } else {
        ctx.fillStyle = "rgba(255, 255, 255, " + alpha + ")";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Drifting clouds
    for (var j = 0; j < clouds.length; j++) {
      var c = clouds[j];
      c.x += c.speed;
      if (c.x > W + 180) c.x = -180;
      if (c.x < -180) c.x = W + 180;
      drawCloud(c);
    }

    // Heart-shaped moon
    drawHeartMoon(W * 0.5, 210, 72);

    // Subtle starry border frame
    ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
    ctx.lineWidth = 2;
    ctx.strokeRect(32, 32, W - 64, H - 64);

    // Centered message: "Life = you"
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "italic 68px Georgia, 'Times New Roman', serif";
    ctx.shadowColor = "rgba(255, 245, 210, 0.65)";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ffffff";
    ctx.fillText("Life = you", W * 0.5, H * 0.52);
    ctx.restore();

    // Bottom-right signature: "XOXO" / "Gagan"
    ctx.save();
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.shadowColor = "rgba(255, 245, 210, 0.45)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "rgba(255, 250, 235, 0.92)";
    ctx.font = "600 28px Georgia, 'Times New Roman', serif";
    ctx.fillText("XOXO", W - 66, H - 104);
    ctx.font = "italic 34px Georgia, 'Times New Roman', serif";
    ctx.fillText("Gagan", W - 66, H - 64);
    ctx.restore();

    // Interactive stardust particles
    for (var k = bursts.length - 1; k >= 0; k--) {
      var b = bursts[k];
      b.x += b.vx;
      b.y += b.vy;
      b.life -= 0.025;
      if (b.life <= 0) {
        bursts.splice(k, 1);
        continue;
      }
      drawFourPointStar(b.x, b.y, b.size * b.life, b.life);
    }

    requestAnimationFrame(render);
  }

  // Mobile & Desktop Save Image button
  document.getElementById("saveBtn").addEventListener("click", function () {
    var dataUrl = canvas.toDataURL("image/png");
    var link = document.createElement("a");
    link.download = "life-equals-you.png";
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  render();
})();
</script>
</body>
</html>
