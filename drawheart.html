<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Draw a Perfect Heart</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: #111; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; overflow: hidden;
    }
    #hud { text-align: center; margin-bottom: 10px; }
    #score { font-size: 1.2rem; font-weight: bold; color: #ff4b72; }
    #result { font-size: 1rem; min-height: 1.5em; margin-top: 4px; }
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    select, button {
      padding: 8px 16px; font-size: 0.9rem; font-weight: bold;
      color: #fff; background: #ff4b72; border: none;
      border-radius: 16px; cursor: pointer; outline: none;
    }
    select { background: #333; border: 1px solid #ff4b72; }
    select option:disabled { color: #666; background: #222; }
    button:active { transform: scale(0.95); }

    /* Modal Popup Overlay */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .popup {
      background: #222; border: 2px solid #ff4b72;
      border-radius: 20px; padding: 25px 20px; text-align: center;
      max-width: 85%; width: 320px;
      box-shadow: 0 10px 30px rgba(255, 75, 114, 0.4);
      transform: scale(0.8); transition: transform 0.3s ease;
    }
    .overlay.active .popup { transform: scale(1); }
    .popup h2 { color: #ff4b72; margin: 0 0 10px 0; font-size: 1.5rem; }
    .popup p { font-size: 1.2rem; font-weight: 600; line-height: 1.4; margin: 15px 0; color: #fff; }
    .popup button { background: #ff4b72; font-size: 1rem; width: 100%; padding: 10px; }
  </style>
</head>
<body>

  <div id="hud">
    <div id="score">Successes: 0 / 5</div>
    <div id="result">Draw a heart in one continuous stroke!</div>
  </div>

  <canvas id="paintCanvas"></canvas>

  <div class="controls">
    <select id="difficulty" onchange="changeDifficulty()">
      <option value="75">Easy (>75%)</option>
      <option value="80" disabled>Medium (>80%) 🔒</option>
      <option value="85" disabled>Hard (>85%) 🔒</option>
      <option value="90" disabled>Extremely Hard (>90%) 🔒</option>
    </select>
    <button onclick="resetGame()">Reset</button>
  </div>

  <div class="overlay" id="popupOverlay">
    <div class="popup">
      <h2 id="popupTitle">Level Cleared!</h2>
      <p id="popupMessage">I love you Jasleena Saluja!</p>
      <button onclick="closePopup()">Continue</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    const diffSelect = document.getElementById('difficulty');
    const overlay = document.getElementById('popupOverlay');
    const popupMessage = document.getElementById('popupMessage');
    const popupTitle = document.getElementById('popupTitle');

    let isDrawing = false;
    let userPoints = [];
    let successes = 0;
    const MAX_SUCCESSES = 5;
    let targetAccuracy = parseInt(diffSelect.value);

    // Romantic love messages for Jasleena
    const loveMessages = [
      "I love you Jasleena Saluja ❤️",
      "You're mine Jass 💕",
      "Jg4life 💖",
      "Forever & Always, Jasleena Saluja 💗",
      "You hold the key to my heart, Jass 💞",
      "My heart beats only for Jasleena 💓"
    ];

    function resizeCanvas() {
      const size = Math.min(window.innerWidth - 40, window.innerHeight - 200, 400);
      canvas.width = size;
      canvas.height = size;
      clearCanvas();
    }
    window.addEventListener('resize', resizeCanvas);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      if (successes >= MAX_SUCCESSES) return;
      isDrawing = true;
      userPoints = [getPos(e)];
      clearCanvas();
      ctx.strokeStyle = '#ff4b72';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(userPoints[0].x, userPoints[0].y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pt = getPos(e);
      userPoints.push(pt);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      if (userPoints.length < 20) {
        resultEl.textContent = "Too short! Draw a complete heart.";
        return;
      }
      evaluateHeart();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDrawing);

    function evaluateHeart() {
      const samples = resample(userPoints, 100);
      const target = getIdealHeart(samples);

      let totalErr = 0;
      let width = Math.max(...samples.map(p => p.x)) - Math.min(...samples.map(p => p.x));
      let height = Math.max(...samples.map(p => p.y)) - Math.min(...samples.map(p => p.y));
      let scale = (width + height) / 2;

      for (let i = 0; i < 100; i++) {
        let minDist = Infinity;
        for (let j = 0; j < 100; j++) {
          let d = Math.hypot(samples[i].x - target[j].x, samples[i].y - target[j].y);
          if (d < minDist) minDist = d;
        }
        totalErr += minDist;
      }

      let avgErr = totalErr / 100;
      let accuracy = Math.max(0, 100 - (avgErr / scale) * 250);
      accuracy = Math.round(accuracy * 10) / 10;

      if (accuracy >= targetAccuracy) {
        successes++;
        scoreEl.textContent = `Successes: ${successes} / ${MAX_SUCCESSES}`;
        if (successes >= MAX_SUCCESSES) {
          unlockNextLevel();
        } else {
          resultEl.textContent = `Great! Accuracy: ${accuracy}% (Passed)`;
        }
      } else {
        resultEl.textContent = `Accuracy: ${accuracy}% (Needs >${targetAccuracy}%)`;
      }
    }

    function unlockNextLevel() {
      const currentIndex = diffSelect.selectedIndex;
      const nextOption = diffSelect.options[currentIndex + 1];

      // Select a random romantic message
      const randomMsg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
      popupMessage.textContent = randomMsg;

      if (nextOption) {
        nextOption.disabled = false;
        nextOption.text = nextOption.text.replace(' 🔒', '');
        popupTitle.textContent = "🎉 Level Cleared!";
        overlay.classList.add('active');

        // Advance to next level upon closing popup
        window.pendingNextIndex = currentIndex + 1;
      } else {
        popupTitle.textContent = "🏆 Game Completed!";
        overlay.classList.add('active');
        window.pendingNextIndex = null;
      }
    }

    function closePopup() {
      overlay.classList.remove('active');
      if (window.pendingNextIndex !== null && window.pendingNextIndex !== undefined) {
        diffSelect.selectedIndex = window.pendingNextIndex;
        window.pendingNextIndex = null;
        changeDifficulty();
      }
    }

    function resample(points, n) {
      let totalLen = 0;
      for (let i = 1; i < points.length; i++) totalLen += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
      let interval = totalLen / (n - 1);
      let res = [points[0]];
      let dist = 0;
      
      for (let i = 1; i < points.length; i++) {
        let d = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
        if (dist + d >= interval) {
          let t = (interval - dist) / d;
          let nx = points[i-1].x + t * (points[i].x - points[i-1].x);
          let ny = points[i-1].y + t * (points[i].y - points[i-1].y);
          res.push({ x: nx, y: ny });
          points.splice(i, 0, { x: nx, y: ny });
          dist = 0;
        } else {
          dist += d;
        }
      }
      while (res.length < n) res.push(points[points.length - 1]);
      return res;
    }

    function getIdealHeart(userSamples) {
      let minX = Math.min(...userSamples.map(p => p.x)), maxX = Math.max(...userSamples.map(p => p.x));
      let minY = Math.min(...userSamples.map(p => p.y)), maxY = Math.max(...userSamples.map(p => p.y));
      let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      let w = maxX - minX, h = maxY - minY;

      let pts = [];
      for (let i = 0; i < 100; i++) {
        let t = (i / 100) * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        pts.push({ x: cx + (x / 32) * w, y: cy + (y / 32) * h });
      }
      return pts;
    }

    function changeDifficulty() {
      targetAccuracy = parseInt(diffSelect.value);
      resetGame();
    }

    function resetGame() {
      successes = 0;
      scoreEl.textContent = `Successes: 0 / ${MAX_SUCCESSES}`;
      resultEl.textContent = "Draw a heart in one continuous stroke!";
      clearCanvas();
    }

    resizeCanvas();
  </script>
</body>
</html>
