
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Happy Scale — Jasleena Saluja</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090208;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;z-index:1}
.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 20px;border-radius:99px;background:rgba(42,10,28,.7);border:1px solid rgba(255,192,224,.38);box-shadow:0 4px 20px rgba(255,64,129,.35);backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:#ffd700;box-shadow:0 0 10px #ffd700;animation:pd 1.6s ease-in-out infinite}
.btxt{color:#ffe4b5;font:800 12px/1 system-ui,sans-serif;letter-spacing:.18em}
.mid{position:relative;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px;max-width:84vw;transform:translateY(6px)}
.bheart{font-size:clamp(1.5rem,4vw,2.3rem);margin-bottom:4px;filter:drop-shadow(0 0 14px rgba(255,77,148,.9));animation:hb 1.4s ease-in-out infinite}
.pre{font:italic 400 clamp(1.15rem,3vw,2rem)/1.2 Georgia,serif;color:#ffd6e7;letter-spacing:.05em;text-shadow:0 0 14px rgba(255,105,180,.75)}
.name{font:italic 700 clamp(2rem,5.6vw,4rem)/1.12 "Snell Roundhand","Brush Script MT",Georgia,serif;background:linear-gradient(120deg,#fff,#ffb3d9 30%,#ffd700 55%,#ff85b3 80%,#fff);background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(255,77,148,.85)) drop-shadow(0 0 26px rgba(255,215,0,.4));animation:sh 4.2s linear infinite,hb 2.6s ease-in-out infinite;padding:2px 8px}
.stat{margin-top:10px;padding:6px 16px;border-radius:99px;background:rgba(28,5,18,.8);border:1px solid rgba(255,182,217,.4);color:#ffcce0;font:700 clamp(.74rem,1.9vw,.9rem)/1.2 system-ui,sans-serif;letter-spacing:.07em;font-variant-numeric:tabular-nums}
.val{color:#ffd700;font-weight:800;text-shadow:0 0 10px rgba(255,215,0,.65)}
.sub{margin-top:6px;color:#ffe4b5;font:700 10px/1 system-ui,sans-serif;letter-spacing:.16em;opacity:.88}
.bot{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2}
.btn{cursor:pointer;border:1px solid rgba(255,235,180,.55);border-radius:99px;padding:12px 26px;font:700 14px/1 system-ui,sans-serif;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#f43f5e,#ec4899 52%,#f59e0b);box-shadow:0 6px 24px rgba(244,63,94,.6),0 0 18px rgba(251,191,36,.4);transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.95)}
@keyframes pd{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.6}}
@keyframes sh{0%{background-position:0 center}100%{background-position:220% center}}
@keyframes hb{0%,100%{transform:scale(1)}16%{transform:scale(1.08)}32%{transform:scale(1)}48%{transform:scale(1.05)}}
</style></head><body><div id="app"><canvas id="c"></canvas>
<div class="top"><div class="badge"><span class="dot"></span><span class="btxt">HAPPY SCALE</span><span>💖</span></div></div>
<div class="mid"><div class="bheart">💗</div><div class="pre">I love you,</div><h1 class="name">Jasleena Saluja</h1><div class="stat">HAPPINESS: <span id="v" class="val">100.00% ↑</span></div><div class="sub">ALWAYS ON THE RISE</div></div>
<div class="bot"><button id="b" type="button" class="btn">Send More Love ✨</button></div>
</div><script>
(()=>{
const c=document.getElementById("c"),x=c.getContext("2d"),v=document.getElementById("v"),b=document.getElementById("b"),K="jasleena_happy_scale_v2";
const load=()=>{let n=100;try{let s=localStorage.getItem(K);if(s&&+s>=100)return+s}catch(e){}try{if(window.name.startsWith(K+"=")){let s=+window.name.slice(K.length+1);if(s>=100)return s}}catch(e){}return n};
const save=n=>{let s=n.toFixed(4);try{localStorage.setItem(K,s)}catch(e){}try{window.name=K+"="+s}catch(e){}};
let hap=load(),W=0,H=0,cx=0,cy=0,R=180,t=0,lt=performance.now(),boost=0,hearts=[],dust=[],bursts=[],rings=[];
const show=()=>{v.textContent=hap.toFixed(2)+"% \u2191"};show();
setInterval(()=>save(hap),1000);
["beforeunload","pagehide"].forEach(e=>addEventListener(e,()=>save(hap)));
document.addEventListener("visibilitychange",()=>{if(document.hidden)save(hap)});
const resize=()=>{let d=Math.min(devicePixelRatio||1,2);W=innerWidth||360;H=innerHeight||640;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);cx=W*.5;cy=H*.51;R=Math.max(125,Math.min(Math.min(W,H)*.37,295))};
addEventListener("resize",resize);resize();
const heartPath=(px,py,s)=>{let h=s*.3;x.beginPath();x.moveTo(px,py+h);x.bezierCurveTo(px,py,px-s*.5,py,px-s*.5,py+h);x.bezierCurveTo(px-s*.5,py+(s+h)*.5,px,py+(s+h)*.72,px,py+s);x.bezierCurveTo(px,py+(s+h)*.72,px+s*.5,py+(s+h)*.5,px+s*.5,py+h);x.bezierCurveTo(px+s*.5,py,px,py,px,py+h);x.closePath()};
for(let i=0;i<26;i++)hearts.push({x:Math.random()*W,y:Math.random()*H,s:9+Math.random()*13,vy:24+Math.random()*38,sa:12+Math.random()*20,sf:.8+Math.random()*1.3,p:Math.random()*6.28,a:.14+Math.random()*.3,h:332+Math.random()*28});
for(let i=0;i<55;i++)dust.push({x:Math.random()*W,y:Math.random()*H,vy:14+Math.random()*28,vx:(Math.random()-.5)*12,r:1+Math.random()*2.3,p:Math.random()*6.28,sp:2+Math.random()*3.5});
const burst=(px,py,n)=>{boost=Math.min(boost+1,3);hap+=1;show();save(hap);rings.push({r:R*.88,a:.85});const cols=["#ff4d94","#ff85b3","#ffd700","#ffb347","#fff","#fb7185"];for(let i=0;i<n;i++){let a=6.283*i/n+(Math.random()-.5)*.45,sp=90+Math.random()*230;bursts.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-45,s:7+Math.random()*10,a:1,d:.75+Math.random()*.6,c:cols[i%cols.length],h:Math.random()>.35})}};
c.addEventListener("pointerdown",e=>{let r=c.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,24)});
b.addEventListener("click",e=>{e.stopPropagation();burst(cx,cy-R*.15,36)});
const frame=now=>{
  let dt=Math.min(.25,Math.max(.001,(now-lt)/1000));lt=now;t+=dt;boost*=Math.pow(.08,dt);
  hap+=(.25+boost*1.8)*dt;show();
  let bg=x.createRadialGradient(cx,cy,18,cx,cy,Math.max(W,H)*.82);
  bg.addColorStop(0,`rgba(46,12,35,${.88+Math.sin(t*1.1)*.08})`);bg.addColorStop(.52,"#1a0714");bg.addColorStop(1,"#090208");
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  for(let k=0;k<3;k++){let bx=cx+Math.cos(t*.35+k*2.1)*W*.24,by=cy+Math.sin(t*.28+k*1.7)*H*.18,br=Math.max(135,R*1.3),ag=x.createRadialGradient(bx,by,0,bx,by,br);ag.addColorStop(0,k===1?"rgba(255,190,90,.07)":"rgba(255,77,148,.08)");ag.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=ag;x.beginPath();x.arc(bx,by,br,0,6.283);x.fill()}
  hearts.forEach(h=>{h.y-=h.vy*(1+boost*.5)*dt;if(h.y<-30){h.y=H+20;h.x=Math.random()*W}x.save();x.fillStyle=`hsla(${h.h},92%,72%,${h.a})`;x.shadowColor="rgba(255,105,180,.45)";x.shadowBlur=8;heartPath(h.x+Math.sin(t*h.sf+h.p)*h.sa,h.y,h.s);x.fill();x.restore()});
  dust.forEach(d=>{d.y-=d.vy*dt;d.x+=d.vx*dt;if(d.y<-8){d.y=H+8;d.x=Math.random()*W}if(d.x<-8)d.x=W+8;if(d.x>W+8)d.x=-8;let tw=.25+.75*(.5+.5*Math.sin(t*d.sp+d.p));x.fillStyle=`rgba(255,223,115,${tw})`;x.beginPath();x.arc(d.x,d.y,d.r,0,6.283);x.fill()});
  for(let i=rings.length-1;i>=0;i--){let g=rings[i];g.r+=190*dt;g.a-=.85*dt;if(g.a<=0){rings.splice(i,1);continue}x.strokeStyle=`rgba(255,215,0,${g.a})`;x.lineWidth=4;x.beginPath();x.arc(cx,cy,g.r,0,6.283);x.stroke()}
  let sa=Math.PI*.76,ea=Math.PI*2.24,sp=ea-sa,r=R+Math.sin(t*2.5)*3.5+boost*7.5,lw=Math.max(13,R*.085);
  let ig=x.createRadialGradient(cx,cy,r*.1,cx,cy,r*1.4);ig.addColorStop(0,`rgba(255,85,155,${.2+boost*.08})`);ig.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=ig;x.beginPath();x.arc(cx,cy,r*1.4,0,6.283);x.fill();
  x.save();x.lineCap="round";x.lineWidth=lw;x.strokeStyle="rgba(255,192,224,.14)";x.beginPath();x.arc(cx,cy,r,sa,ea);x.stroke();
  let mg=x.createLinearGradient(cx-r,cy+r*.4,cx+r,cy-r*.4);mg.addColorStop(0,"#e11d48");mg.addColorStop(.35,"#ff4d94");mg.addColorStop(.7,"#fb7185");mg.addColorStop(1,"#ffd700");
  x.shadowColor="rgba(255,105,180,.85)";x.shadowBlur=18+Math.sin(t*4)*6+boost*12;x.strokeStyle=mg;x.beginPath();x.arc(cx,cy,r,sa,ea);x.stroke();
  for(let p=0;p<3;p++){let u=(t*.55+p/3)%1;x.shadowColor="#ffd700";x.shadowBlur=16;x.lineWidth=lw*.5;x.strokeStyle=`rgba(255,250,215,${Math.sin(u*Math.PI)*.9})`;x.beginPath();x.arc(cx,cy,r,sa+Math.max(0,u-.2)*sp,sa+u*sp);x.stroke()}
  let pa=ea+Math.abs(Math.sin(t*6))*.03+boost*.025,px=cx+Math.cos(pa)*r,py=cy+Math.sin(pa)*r,pg=x.createRadialGradient(px,py,2,px,py,24+boost*8);
  pg.addColorStop(0,"#fff");pg.addColorStop(.35,"#ffd700");pg.addColorStop(.75,"rgba(255,77,148,.5)");pg.addColorStop(1,"rgba(255,77,148,0)");
  x.fillStyle=pg;x.beginPath();x.arc(px,py,24+boost*8,0,6.283);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(px,py,5,0,6.283);x.fill();
  let fs=Math.max(11,Math.round(R*.068)),ld=r+Math.max(22,R*.13);x.font=`700 ${fs}px system-ui,sans-serif`;x.textAlign="center";x.textBaseline="middle";x.shadowBlur=0;
  x.fillStyle="rgba(255,198,226,.82)";x.fillText("100%",cx+Math.cos(sa)*ld,cy+Math.sin(sa)*ld+8);
  x.fillStyle="#ffd700";x.shadowColor="rgba(255,215,0,.85)";x.shadowBlur=10;x.fillText("HAPPIEST \u2191",cx+Math.cos(ea)*ld,cy+Math.sin(ea)*ld+8);x.restore();
  for(let i=bursts.length-1;i>=0;i--){let q=bursts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=95*dt;q.vx*=Math.pow(.18,dt);q.a-=q.d*dt;if(q.a<=0){bursts.splice(i,1);continue}x.save();x.globalAlpha=q.a;x.fillStyle=q.c;x.shadowColor=q.c;x.shadowBlur=10;if(q.h){heartPath(q.x,q.y,q.s);x.fill()}else{x.beginPath();x.arc(q.x,q.y,q.s*.45,0,6.283);x.fill()}x.restore()}
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);setTimeout(()=>burst(cx,cy-R*.2,20),220);
})();
</script></body></html>
