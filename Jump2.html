<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Love Run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body,html{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;position:fixed;inset:0}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none;background:linear-gradient(to bottom,#1e1b4b,#312e81,#4c1d95,#831843)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;color:#fff;text-align:center;padding:24px}
.hidden{display:none!important}
h1{font-size:2.2rem;margin-bottom:12px;background:linear-gradient(to right,#f43f5e,#fb7185,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
p{font-size:1.05rem;color:#cbd5e1;margin-bottom:28px;max-width:380px;line-height:1.5}
.btn{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;border:none;padding:16px 40px;font-size:1.15rem;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 10px 25px -5px rgba(244,63,94,.5)}
#hud{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:max(16px,env(safe-area-inset-top,16px)) 20px 10px;z-index:5;pointer-events:none}
.hud-group{display:flex;align-items:center;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}
.progress-bar-container{flex-grow:1;max-width:200px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin:0 15px}
.progress-fill{height:100%;background:linear-gradient(90deg,#f43f5e,#fb7185);width:0%}
.jump-dots{display:flex;gap:4px;margin-top:3px}
.jdot{width:6px;height:6px;background:rgba(255,255,255,.4);border-radius:50%}
.jdot.active{background:#fff;box-shadow:0 0 6px #fff}
#mobileJumpBtn{position:absolute;bottom:max(20px,env(safe-area-inset-bottom,20px));right:20px;width:84px;height:84px;background:rgba(244,63,94,.85);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.4);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.9rem;z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" class="hidden">
  <div class="hud-group"><span style="font-size:.85rem;font-weight:700;color:#fb7185">LOVE RUN</span></div>
  <div class="progress-bar-container"><div id="progressFill" class="progress-fill"></div></div>
  <div class="hud-group"><span id="scoreVal" style="font-size:.85rem;font-weight:700;color:#fff">0%</span></div>
</div>
<div id="mobileJumpBtn" class="hidden">JUMP
  <div class="jump-dots" id="jumpDots">
    <div class="jdot active"></div><div class="jdot active"></div><div class="jdot active"></div>
  </div>
</div>
<div id="startScreen" class="overlay">
  <h1>Love Run</h1>
  <p>Help <b>G</b> & <b>J</b> leap together over obstacles to reach the flag!</p>
  <button class="btn" id="startBtn">Start Journey</button>
</div>
<div id="gameOverScreen" class="overlay hidden">
  <h1>Stumbled! ❤️</h1>
  <p>True love gets right back up to try again.</p>
  <button class="btn" id="retryBtn">Try Again</button>
</div>
<div id="victoryScreen" class="overlay hidden">
  <h1>I love you Jasleena Saluja</h1>
  <p>Together through every obstacle, hand in hand, forever.</p>
  <button class="btn" id="restartBtn">Run Again</button>
</div>

<script>
const c = document.getElementById("gameCanvas");
const ctx = c.getContext("2d");

let w = window.innerWidth || 393;
let h = window.innerHeight || 852;
let groundY = h - 120;

// ---- Game state (declared BEFORE resize is ever called) ----
let gameState = "START";
let cameraX = 0;
let worldLength = 5000;
let gameTime = 0;

const player = {
  x: 120, y: 0, vy: 0,
  width: 48, height: 70,
  isGrounded: false,
  jumpsLeft: 3, maxJumps: 3
};
const GRAVITY = 1600;
const JUMP_FORCE = -580;
const RUN_SPEED = 280;

let obstacles = [], skyNotes = [], particles = [], stars = [];
for (let i = 0; i < 40; i++) {
  stars.push({
    x: Math.random() * worldLength * 1.2,
    y: Math.random() * (h * .55),
    size: Math.random() * 2.5 + 1,
    alpha: Math.random() * .7 + .3
  });
}

const phrases = ["tu bas tu Hai","3000","chall","kinni sohni tu","babbia","forever","my heart","always"];

// ---- Resize (safe to call now — player & gameState exist) ----
function resize() {
  w = window.innerWidth;
  h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  c.width  = w * dpr;
  c.height = h * dpr;
  // FIX: reset transform instead of stacking scale on every resize
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = h - 120;
  if (gameState !== "RUNNING") {
    player.y = groundY - player.height;
  }
}
window.addEventListener("resize", resize);
resize(); // safe now

// ---- Audio ----
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function playSound(t) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    if (t === "jump") {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(300, now);
      o.frequency.exponentialRampToValueAtTime(600, now + .15);
      g.gain.setValueAtTime(.15, now);
      g.gain.linearRampToValueAtTime(.01, now + .15);
      o.start(now); o.stop(now + .15);
    } else if (t === "win") {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const os = audioCtx.createOscillator(), gn = audioCtx.createGain();
        os.connect(gn); gn.connect(audioCtx.destination);
        os.frequency.setValueAtTime(f, now + i * .12);
        gn.gain.setValueAtTime(.2, now + i * .12);
        gn.gain.linearRampToValueAtTime(.01, now + i * .12 + .3);
        os.start(now + i * .12); os.stop(now + i * .12 + .3);
      });
    }
  } catch(e) {}
}

// ---- Level ----
function initLevel() {
  cameraX = 0; gameTime = 0;
  groundY = h - 120;
  player.x = 120;
  player.y = groundY - player.height;
  player.vy = 0;
  player.jumpsLeft = 3;
  obstacles = []; skyNotes = []; particles = [];

  for (let i = 0; i < 16; i++) {
    skyNotes.push({
      x: 400 + i * 280 + Math.random() * 100,
      y: 80 + Math.random() * (h * .35),
      text: phrases[i % phrases.length]
    });
  }

  const types = ["cactus","frog","dragon","pit"];
  let cx = 650;
  while (cx < worldLength - 500) {
    const t = types[Math.floor(Math.random() * types.length)];
    if (t === "pit") {
      obstacles.push({ type:"pit", x:cx, width:110, height:40 });
      cx += 320 + Math.random() * 120;
    } else if (t === "cactus") {
      obstacles.push({ type:"cactus", x:cx, width:34, height:50 });
      cx += 280 + Math.random() * 120;
    } else if (t === "frog") {
      obstacles.push({ type:"frog", x:cx, width:40, height:35 });
      cx += 300 + Math.random() * 130;
    } else if (t === "dragon") {
      obstacles.push({ type:"dragon", x:cx, width:50, height:40, yOffset: Math.random() * 40 });
      cx += 340 + Math.random() * 140;
    }
  }
}

// ---- Jump input (with double-fire guard for mobile) ----
function triggerJump() {
  if (gameState !== "RUNNING" || player.jumpsLeft <= 0) return;
  player.vy = JUMP_FORCE;
  player.isGrounded = false;
  player.jumpsLeft--;
  playSound("jump");
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: player.x + player.width / 2,
      y: player.y + player.height,
      vx: (Math.random() - .5) * 150,
      vy: Math.random() * -100 - 20,
      life: .4, color: "#fb7185"
    });
  }
}

let lastTouchT = 0;
function handleJump(e) {
  e.preventDefault();
  initAudio();
  // Ignore the synthetic "click" that follows a touchstart on mobile
  if (e.type === "click") {
    if (performance.now() - lastTouchT < 600) return;
  } else {
    lastTouchT = performance.now();
  }
  if (gameState === "RUNNING") triggerJump();
}

window.addEventListener("keydown", e => {
  if (["Space","ArrowUp","KeyW"].includes(e.code)) {
    e.preventDefault();
    initAudio();
    if (gameState === "RUNNING") triggerJump();
  }
});

document.getElementById("mobileJumpBtn").addEventListener("touchstart", handleJump, { passive:false });
document.getElementById("mobileJumpBtn").addEventListener("click", handleJump);
c.addEventListener("touchstart", handleJump, { passive:false });
c.addEventListener("click", handleJump);

// ---- Buttons ----
function startGame() {
  initAudio();
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  document.getElementById("victoryScreen").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  document.getElementById("mobileJumpBtn").classList.remove("hidden");
  initLevel();
  gameState = "RUNNING";
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("retryBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);

// ---- Main loop ----
let lastT = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastT) / 1000, .1);
  lastT = now;

  if (gameState === "RUNNING") {
    gameTime += dt;
    cameraX += RUN_SPEED * dt;
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    // Pit check
    let overPit = false;
    for (let obs of obstacles) {
      if (obs.type === "pit" &&
          player.x + cameraX + player.width > obs.x + 10 &&
          player.x + cameraX < obs.x + obs.width - 10 &&
          player.y + player.height >= groundY) {
        overPit = true;
      }
    }

    if (!overPit && player.y + player.height >= groundY) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.isGrounded = true;
      player.jumpsLeft = player.maxJumps;
    } else if (overPit && player.y > groundY + 120) {
      gameState = "GAMEOVER";
      document.getElementById("hud").classList.add("hidden");
      document.getElementById("mobileJumpBtn").classList.add("hidden");
      document.getElementById("gameOverScreen").classList.remove("hidden");
    }

    // Obstacle collision
    const pBox = {
      x: player.x + cameraX + 8,
      y: player.y + 4,
      w: player.width - 16,
      h: player.height - 8
    };
    for (let obs of obstacles) {
      if (obs.type === "pit") continue;
      let oBox = {
        x: obs.x + 6,
        y: groundY - obs.height + 4,
        w: obs.width - 12,
        h: obs.height - 8
      };
      if (obs.type === "dragon") {
        oBox.y = groundY - 110 - obs.yOffset + Math.sin(gameTime * 4 + obs.x) * 15;
        oBox.h = 30;
      }
      if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
          pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
        gameState = "GAMEOVER";
        document.getElementById("hud").classList.add("hidden");
        document.getElementById("mobileJumpBtn").classList.add("hidden");
        document.getElementById("gameOverScreen").classList.remove("hidden");
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Progress
    const traveled = cameraX + player.x;
    const prog = Math.min(Math.floor((traveled / worldLength) * 100), 100);
    document.getElementById("progressFill").style.width = prog + "%";
    document.getElementById("scoreVal").textContent = prog + "%";

    const dots = document.getElementById("jumpDots").children;
    for (let i = 0; i < 3; i++) {
      dots[i].classList.toggle("active", i < player.jumpsLeft);
    }

    // Victory when the runners REACH the flag
    if (traveled >= worldLength) {
      gameState = "VICTORY";
      document.getElementById("hud").classList.add("hidden");
      document.getElementById("mobileJumpBtn").classList.add("hidden");
      document.getElementById("victoryScreen").classList.remove("hidden");
      playSound("win");
    }
  }

  // ===================== RENDER =====================
  ctx.clearRect(0, 0, w, h);

  // Sky
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, "#1e1b4b");
  bg.addColorStop(.5, "#312e81");
  bg.addColorStop(.8, "#581c87");
  bg.addColorStop(1, "#831843");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Stars
  ctx.fillStyle = "#fff";
  for (let s of stars) {
    let sx = (s.x - cameraX * .2) % (worldLength * 1.2);
    if (sx < 0) sx += worldLength * 1.2;
    ctx.globalAlpha = s.alpha;
    ctx.fillRect(sx, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // Sky notes
  ctx.font = "600 16px sans-serif";
  ctx.textAlign = "center";
  for (let n of skyNotes) {
    let nx = n.x - cameraX * .5;
    let ny = n.y + Math.sin(gameTime * 1.5 + n.x) * 10;
    if (nx > -150 && nx < w + 150) {
      ctx.fillStyle = "rgba(255,182,193,.25)";
      ctx.fillText(n.text, nx + 1, ny + 1);
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillText(n.text, nx, ny);
    }
  }

  // Mountains
  ctx.save();
  ctx.fillStyle = "#3b0764";
  ctx.beginPath();
  ctx.moveTo(-100, groundY);
  for (let i = -1; i < 15; i++) {
    ctx.lineTo(i * 600 + 300, groundY - 180);
    ctx.lineTo(i * 600 + 600, groundY);
  }
  ctx.lineTo(w + 100, groundY);
  ctx.fill();

  // Ground
  ctx.fillStyle = "#4c0519";
  ctx.fillRect(-200, groundY, w + 400, h - groundY);
  ctx.fillStyle = "#f43f5e";
  ctx.fillRect(-200, groundY, w + 400, 4);
  ctx.restore();

  // World objects (scroll with camera)
  ctx.save();
  ctx.translate(-cameraX, 0);

  for (let obs of obstacles) {
    if (obs.type === "pit") {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(obs.x, groundY, obs.width, h - groundY + 50);
    } else if (obs.type === "cactus") {
      ctx.fillStyle = "#10b981";
      ctx.fillRect(obs.x + 10, groundY - obs.height, 14, obs.height);
      ctx.fillRect(obs.x, groundY - obs.height + 15, 10, 8);
      ctx.fillRect(obs.x, groundY - obs.height + 8, 6, 12);
      ctx.fillRect(obs.x + 24, groundY - obs.height + 25, 10, 8);
      ctx.fillRect(obs.x + 28, groundY - obs.height + 16, 6, 16);
    } else if (obs.type === "frog") {
      let ho = Math.abs(Math.sin(gameTime * 8 + obs.x)) * 14;
      ctx.fillStyle = "#84cc16";
      ctx.beginPath();
      ctx.arc(obs.x + 20, groundY - obs.height / 2 - ho, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(obs.x + 12, groundY - obs.height - 4 - ho, 5, 0, Math.PI * 2);
      ctx.arc(obs.x + 28, groundY - obs.height - 4 - ho, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(obs.x + 12, groundY - obs.height - 4 - ho, 2, 0, Math.PI * 2);
      ctx.arc(obs.x + 28, groundY - obs.height - 4 - ho, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (obs.type === "dragon") {
      let dy = groundY - 110 - obs.yOffset + Math.sin(gameTime * 4 + obs.x) * 15;
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.ellipse(obs.x + 25, dy + 20, 24, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ea580c";
      ctx.beginPath();
      ctx.moveTo(obs.x + 20, dy + 10);
      ctx.lineTo(obs.x + 10, dy - 10);
      ctx.lineTo(obs.x + 30, dy + 5);
      ctx.fill();
    }
  }

  // Flag
  ctx.fillStyle = "#94a3b8";
  ctx.fillRect(worldLength, groundY - 180, 6, 180);
  ctx.fillStyle = "#f43f5e";
  ctx.beginPath();
  ctx.moveTo(worldLength + 6, groundY - 180);
  ctx.lineTo(worldLength + 56, groundY - 150);
  ctx.lineTo(worldLength + 6, groundY - 120);
  ctx.fill();

  ctx.restore();

  // ---- Runners (G & J) ----
  const px = player.x, py = player.y;
  const la = Math.sin(gameTime * 18) * 14;
  const footY = py + player.height; // FIX: feet follow the body, not the ground
  const gx = px - 12, jx = px + 12;

  ctx.lineWidth = 3.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // G (blue)
  ctx.strokeStyle = "#38bdf8";
  ctx.beginPath();
  ctx.arc(gx, py + 12, 10, 0, Math.PI * 2);
  ctx.moveTo(gx, py + 22); ctx.lineTo(gx, py + 46);
  ctx.moveTo(gx, py + 46); ctx.lineTo(gx - 8 + la, footY);
  ctx.moveTo(gx, py + 46); ctx.lineTo(gx + 8 - la, footY);
  ctx.moveTo(gx, py + 30); ctx.lineTo(gx - 10, py + 40);
  ctx.moveTo(gx, py + 30); ctx.lineTo(gx + 10, py + 38);
  ctx.stroke();

  // J (pink)
  ctx.strokeStyle = "#f472b6";
  ctx.beginPath();
  ctx.arc(jx, py + 12, 10, 0, Math.PI * 2);
  ctx.moveTo(jx, py + 22); ctx.lineTo(jx, py + 44);
  ctx.moveTo(jx, py + 44); ctx.lineTo(jx - 8 - la, footY);
  ctx.moveTo(jx, py + 44); ctx.lineTo(jx + 8 + la, footY);
  ctx.moveTo(jx, py + 30); ctx.lineTo(gx + 10, py + 38);
  ctx.stroke();

  // J's dress
  ctx.fillStyle = "#f472b6";
  ctx.beginPath();
  ctx.moveTo(jx - 10, py + 44);
  ctx.lineTo(jx + 10, py + 44);
  ctx.lineTo(jx, py + 28);
  ctx.fill();

  // Labels & heart
  ctx.fillStyle = "#f43f5e";
  ctx.font = "700 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("G", gx, py - 8);
  ctx.fillText("J", jx, py - 8);
  ctx.font = "16px sans-serif";
  ctx.fillText("❤️", px, py - 24 + Math.sin(gameTime * 6) * 4);

  // Particles
  ctx.save();
  ctx.translate(-cameraX, 0);
  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / .4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
